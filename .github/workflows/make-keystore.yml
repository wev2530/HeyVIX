name: Make VIX keystore (run once)

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Create keystore
        env:
          PW: ${{ secrets.VIX_KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -keystore vix.keystore -alias vix -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=VIX AI, OU=VIX, O=VIX, C=US"
          keytool -list -v -keystore vix.keystore -alias vix -storepass "$PW" | grep -E "SHA1|SHA256"
          base64 -w 0 vix.keystore > vix.keystore.b64.txt

      - name: Save keystore text
        uses: actions/upload-artifact@v4
        with:
          name: vix-keystore-base64
          path: vix.keystore.b64.txt
