name: Build Hey VIX APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore VIX signing key
        env:
          KEYSTORE_B64: ${{ secrets.VIX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/vix.keystore"
            echo "VIX_KEYSTORE_PATH=$GITHUB_WORKSPACE/vix.keystore" >> "$GITHUB_ENV"
            echo "Signing key restored."
          else
            echo "WARNING: secret VIX_KEYSTORE_BASE64 is empty. This build will use a random debug key and will NOT update over an older install."
          fi

      - name: Build debug APK
        env:
          VIX_KEYSTORE_PASSWORD: ${{ secrets.VIX_KEYSTORE_PASSWORD }}
        run: gradle assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VIX.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Hey-VIX-APK
          path: VIX.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VIX 1.0.${{ github.run_number }}
          files: VIX.apk
          make_latest: true
          generate_release_notes: true